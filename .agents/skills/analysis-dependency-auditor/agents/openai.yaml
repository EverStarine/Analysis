# **总则**：所有规则都必须写明设立的原因；当规则的原因失效时，规则也应同步失效并删除或修订。所有工作记录都必须服务于后续工作效率的提升；仅记录流水账、对后续工作无意义的内容没有保留必要，评估为无用时应清理。
# 设立原因：界面名称与提示用于准确选择本技能；技能职责或名称改变时同步更新，无用配置应删除。
interface:
  display_name: "分析学证明依赖审计"
  short_description: "定位教材证明调用、定理假设与反向影响，区分前向预告和真实依赖"
  default_prompt: "使用 $analysis-dependency-auditor 检查《分析学》中指定章节或定理的证明依赖，并列出需要复核的直接引用处。"
