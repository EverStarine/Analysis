# **总则**：所有规则都必须写明设立的原因；当规则的原因失效时，规则也应同步失效并删除或修订。所有工作记录都必须服务于后续工作效率的提升；仅记录流水账、对后续工作无意义的内容没有保留必要，评估为无用时应清理。
# 设立原因：界面名称与提示用于准确选择本技能；技能职责或名称改变时同步更新，无用配置应删除。
interface:
  display_name: "分析学构建与版本核对"
  short_description: "按改动选卷构建，检查书目索引引用并核对源码与成品版本身份"
  default_prompt: "使用 $analysis-book-build-check 检查《分析学》本轮改动的构建范围，并在需要时构建目标卷、记录源码与 PDF 的版本对应关系。"
